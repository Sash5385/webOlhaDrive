name: Deploy to Firebase

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch: {}

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install functions dependencies
        run: npm ci --prefix functions

      - name: Build
        run: npm run build

      - name: Deploy to Firebase Hosting and Functions
        # Правила бази (database) тут НЕ деплояться: вони залежать від нових функцій і нових
        # клієнтів (bookedBy, queue_counts), тому виходять ОКРЕМО і останніми — вручну через
        # workflow «Deploy Database Rules» (Actions → Run workflow), коли клієнти вже оновились.
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-sa.json
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx firebase-tools deploy --only hosting:admin,functions --project ${{ secrets.FIREBASE_PROJECT_ID }} --non-interactive --force
          rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
